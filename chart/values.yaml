# Base values for slack-knowledge-bot (all environments). Per-env deltas in values-{staging,production}.yaml.

image:
  repository: ghcr.io/nanohype/slack-knowledge-bot
  tag: '' # pinned per-env
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

serviceAccount:
  # The operator creates and owns the `tenant-runtime` ServiceAccount and binds
  # it to the `<env>-slack-knowledge-bot-tenant` role via an EKS Pod Identity
  # association, so the pod runs as it with no role-arn annotation and the chart
  # carries no AWS account values. The chart references that SA rather than
  # minting its own.
  create: false
  name: tenant-runtime
  # Free-form additional annotations to merge into the ServiceAccount.
  annotations: {}

# Resource attributes the shared chart labels read (tenant-chart-base.labels →
# agents.nanohype.dev/{tenant,platform}). The OTEL_RESOURCE_ATTRIBUTES env var
# under `env:` carries the same values into the app's OTel SDK at runtime.
otel:
  resourceAttributes:
    agents.tenant: workplace
    agents.platform: slack-knowledge-bot

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    httpGet:
      path: /health
      port: 3001
    initialDelaySeconds: 15
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /ready
      port: 3001
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# The public HTTP surface: the health endpoint and the OAuth start/callback
# routes the delegation flow redirects through. Those callbacks are reached from
# the browser after an identity provider redirect, so this Ingress is a
# prerequisite for the flow, not a nicety.
#
# The eks-gitops catalog's ingress implementation is the AWS Load Balancer
# Controller (addons/networking/aws-load-balancer-controller). It creates an
# `alb` IngressClass and does not mark it the cluster default, so the class is
# named explicitly. external-dns runs with `sources: [service, ingress]` and
# publishes a Route53 record for each host off this object. On a cluster
# participating in a VPC it does not own, the Kyverno `inject-adopt-lb-subnets`
# policy fills in the subnet annotation from the scheme set below.
ingress:
  enabled: true
  className: alb
  # internal | internet-facing. The controller defaults to internal when unset;
  # the OAuth redirect lands here from a browser outside the VPC, so say so.
  scheme: internet-facing
  # Cilium runs ENI IPAM with native routing, so pod IPs are VPC IPs and the ALB
  # registers pods directly. Instance targets would need a NodePort Service.
  targetType: ip
  tls:
    enabled: true
    # ACM certificate for the hosts below. Left empty, the controller discovers
    # a certificate in ACM whose domain matches a host on the rules. TLS
    # terminates at the ALB — there is no in-cluster certificate and no Secret.
    certificateArn: ''
  # ALB target-group health check. The app serves /health unauthenticated;
  # the controller would otherwise probe `/`, which is not a route.
  healthcheckPath: /health
  # Set the same value on several Ingresses to put them behind one shared ALB.
  # Empty gives this Ingress a load balancer of its own.
  groupName: ''
  hosts:
    # Set per-env in values-{env}.yaml
    - host: ''
      paths:
        - path: /health
          pathType: Exact
        - path: /oauth
          pathType: Prefix

externalSecret:
  enabled: true
  # ClusterSecretStore name (provisioned by eks-gitops external-secrets addon)
  secretStore: aws-secrets-manager
  refreshInterval: 1h
  # Source secret in AWS Secrets Manager — composed per-env as
  # slack-knowledge-bot/<env>/app-secrets by the platform reconciler. The chart references
  # this via the externalsecret template's `data` keys.
  remoteRefSecret: '' # set per-env (slack-knowledge-bot/<env>/app-secrets)
  # RDS master credentials secret name (provisioned by landing-zone rag component)
  dbCredentialsSecret: '' # set per-env (slack-knowledge-bot/<env>/db-credentials)

prometheusRule:
  # Ships SLO recording rules + burn-rate alerts to a Prometheus Operator
  # (kube-prometheus-stack) via the PrometheusRule CR. Off by default — inert
  # without an operator, which the managed-Prometheus stack (OpenTelemetry Collector + AMP,
  # alerts in Amazon Managed Grafana) doesn't run. Set `enabled: true` on a
  # cluster that runs one.
  enabled: false
  selector:
    release: kube-prometheus-stack

grafanaDashboard:
  # GrafanaDashboard CR reconciled by the grafana-operator onto the external
  # Amazon Managed Grafana (works on both EKS and the local kx cluster).
  enabled: true
  instanceSelector:
    dashboards: external
  allowCrossNamespaceImport: true
  resyncPeriod: 24h

# The audit DLQ-depth alert reads an AWS/SQS CloudWatch metric that needs a
# cloudwatch-exporter feeding AMP — not deployed by default, so it's opt-in.
auditDlq:
  cloudwatchExporterEnabled: false

# Audit consumer — long-running SQS poller.
# Drains tenantInfra.sqsAuditQueueUrl → DynamoDB (auditTable) + S3
# (auditBucket). KEDA owns replica count off the queue depth.
auditConsumer:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  keda:
    enabled: true
    # Poll the SQS queue every 30s to update the metric KEDA scales on.
    pollingInterval: 30
    # After this many seconds of an empty queue, KEDA scales back to
    # minReplicas. 300s = 5min — long enough that brief bursts don't churn,
    # short enough that idle cost is low.
    cooldownPeriod: 300
    # Baseline 0: the consumer pod isn't running when the queue is empty.
    # Set to 1 if you'd rather pay for a hot pod (no cold-start when the
    # first message lands).
    minReplicas: 0
    # Cap on the number of consumer pods. Each pod long-polls + processes
    # 10 messages per batch; 5 pods handle ~50 messages every ~5s.
    maxReplicas: 5
    # KEDA scales up by 1 replica per `targetQueueLength` messages in the
    # queue. 10 here means: 30 messages → 3 replicas; 100 → maxReplicas.
    targetQueueLength: 10

networkPolicy:
  enabled: true
  # Ingress: the load balancer (public OAuth callbacks) and same-namespace
  # (internal probes). Slack events arrive via Socket Mode (outbound WebSocket),
  # not inbound HTTP, so no Slack ingress rule needed.
  #
  # The ALB is not a pod, so it cannot be a namespaceSelector: with target-type
  # ip the connection arrives from an ALB network interface in the cluster VPC,
  # and the source is a VPC address. 10.0.0.0/8 is the range the landing-zone
  # network component allocates VPC CIDRs from; narrow it to the public subnet
  # CIDRs per-env where the blast radius matters.
  ingress:
    - from:
        - podSelector: {}
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 3001
  egress:
    # DNS
    - to:
        # namespaceSelector and podSelector in ONE peer, so they AND. As two
        # sibling list items they are separate peers and NetworkPolicy ORs them,
        # which allows egress to every pod in kube-system plus every same-namespace
        # pod labelled k8s-app=kube-dns — a policy that reads as "DNS only" and is
        # not. The rendered object is valid either way; only the permission differs.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
    # HTTPS to AWS APIs (Bedrock, DynamoDB, S3, SQS, KMS, Secrets Manager),
    # Slack (WebSocket + REST), WorkOS, Notion, Confluence, Google Drive
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.0.0/16 # IMDS — must NOT be reachable from pods
      ports:
        - protocol: TCP
          port: 443
    # Postgres (RDS via landing-zone rag component) + Redis (pipeline component) —
    # endpoint hostnames resolved via DNS; egress restricted by NetworkPolicy to
    # the tenant's VPC CIDR. Replace 10.0.0.0/8 with the actual cluster VPC CIDR
    # via per-env values overrides if tightening is required.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
    # OTLP traces + metrics + logs to the collector gateway OTLP receiver
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 4318

env:
  # Non-secret configuration. Secrets come through the ExternalSecret.
  AWS_REGION: us-west-2
  # The Platform's ModelGateway. The operator derives this from the Platform name
  # and publishes it on ModelGateway.status.endpoint; the app holds no AWS model
  # credential and reaches Bedrock only through here.
  MODEL_GATEWAY_ENDPOINT: http://slack-knowledge-bot-gateway.tenants-slack-knowledge-bot.svc.cluster.local:8080
  # Route names on that gateway, not model ids. The ModelGateway CR maps them to
  # Claude and Titan — including the `us.` cross-region inference profile the
  # Claude family requires, which now lives in the CR rather than here.
  MODEL_ROUTE: default
  EMBEDDING_ROUTE: embeddings
  # Verify the Aurora server cert against the RDS global CA baked into the image
  # (certs/rds-global-bundle.pem). Authenticated-encrypted DB link, not just
  # encrypted. Override to "false" only for a chain-less local Postgres.
  PG_SSL_REJECT_UNAUTHORIZED: 'true'
  RATE_LIMIT_USER_PER_HOUR: '20'
  RATE_LIMIT_WORKSPACE_PER_HOUR: '500'
  STALE_DOC_THRESHOLD_DAYS: '90'
  TOKEN_STORE_ENCRYPTION_CONTEXT: slack-knowledge-bot-token-store
  NODE_ENV: production
  # OTel — exports to the OpenTelemetry Collector gateway in the monitoring
  # namespace provisioned by eks-gitops. The gateway release is named `otel-gateway`, so
  # the Service is `telemetry.monitoring.svc.cluster.local`, exposing otlp-grpc on
  # 4317 and otlp-http on 4318. No per-pod sidecar.
  OTEL_SERVICE_NAME: slack-knowledge-bot
  OTEL_EXPORTER_OTLP_ENDPOINT: http://telemetry.monitoring.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_SAMPLER: always_on
  OTEL_METRICS_EXPORTER: otlp
  OTEL_METRIC_EXPORT_INTERVAL: '60000'
  # Resource attrs — agents.tenant/agents.platform required by PLATFORM_TENANT_CONTRACT
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=slack-knowledge-bot,service.version=0.1.0,agents.tenant=workplace,agents.platform=slack-knowledge-bot'

# Per-tenant infrastructure references — populated by per-env values from
# the landing-zone tenant-substrate component's outputs. Empty at the chart
# level for local dev (where the binaries may use local stubs or kind-side
# mocks).
tenantInfra:
  # DynamoDB tables (3) — tenant-substrate: aws_dynamodb_table.{tokens,audit,identity_cache}.name
  dynamodbTableTokens: ''
  dynamodbTableAudit: ''
  dynamodbTableIdentityCache: ''
  # SQS audit queue + DLQ — tenant-substrate: aws_sqs_queue.{audit,audit_dlq}.url
  sqsAuditQueueUrl: ''
  sqsAuditDlqUrl: ''
  # ElastiCache Redis endpoint — tenant-substrate: aws_elasticache_replication_group.this.primary_endpoint_address
  redisUrl: ''
  # KMS key for token envelope encryption — tenant-substrate: aws_kms_key.tenant.arn
  # (one customer-managed key per tenant; the operator grants GenerateDataKey,
  # Decrypt and DescribeKey on exactly this ARN via the tenant-key-access policy)
  kmsKeyId: ''
  # Aurora Serverless v2 (pgvector) endpoint — tenant-substrate: module.aurora.cluster_endpoint
  pgHost: ''
  pgPort: '5432'
  pgDatabase: slack_knowledge_bot
  # S3 audit-archive bucket — tenant-substrate: aws_s3_bucket.audit.bucket
  auditBucket: ''

nodeSelector: {}
tolerations: []
affinity: {}

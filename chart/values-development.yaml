# Development delta.
image:
  tag: development

replicaCount: 1

ingress:
  hosts:
    - host: slack-knowledge-bot-development.example.com
      paths:
        - path: /health
          pathType: Exact
        - path: /oauth
          pathType: Prefix

externalSecret:
  remoteRefSecret: slack-knowledge-bot/development/app-secrets
  dbCredentialsSecret: slack-knowledge-bot/development/db-credentials

env:
  NODE_ENV: production
  OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=slack-knowledge-bot,service.version=0.1.0,deployment.environment=development,agents.tenant=workplace,agents.platform=slack-knowledge-bot'

tenantInfra:
  # Fill the empties below from the landing-zone tenant-substrate development
  # outputs (terragrunt output -json). Slot names match output names 1:1.
  dynamodbTableTokens: slack-knowledge-bot-development-tokens
  dynamodbTableAudit: slack-knowledge-bot-development-audit
  dynamodbTableIdentityCache: slack-knowledge-bot-development-identity-cache
  sqsAuditQueueUrl: ''
  sqsAuditDlqUrl: ''
  redisUrl: ''
  kmsKeyId: ''
  pgHost: ''
  auditBucket: ''

# Platform CR — declares slack-knowledge-bot as a tenant of the workplace team on the
# eks-agent-platform operator. Apply once per cluster before the
# ApplicationSet entry starts reconciling the chart.
#
# Three CRs declared here:
#   - Tenant       (cluster-scoped; the workplace team the Platform belongs to)
#   - BudgetPolicy (referenced by Platform.spec.budget — required)
#   - Platform     (the actual tenant declaration)
#
# The Tenant and BudgetPolicy/Platform CRs live in different scopes: Tenant is
# cluster-scoped, the other two are namespaced into `tenants-workplace` — the
# workplace team's control-plane namespace, which holds the CRs and nothing
# else. That is distinct from the workload namespace the operator provisions
# (`tenants-slack-knowledge-bot`, derived from Platform.metadata.name).
#
# What the operator reconciles from the Platform CR:
#   - Namespace `tenants-slack-knowledge-bot` (Pod Security Standards baseline)
#   - ResourceQuota + LimitRange
#   - Default-deny NetworkPolicy (the chart layers app-specific rules on top)
#   - ArgoCD AppProject scoped to this Platform
#   - Per-Platform IAM role (`<env>-slack-knowledge-bot-tenant`) with the baseline
#     policy + spec.identity.extraPolicyArns attached and Bedrock invoke
#     clamped to spec.identity.allowedModels (bedrock-model-scoping inline
#     policy). Trust is the EKS Pod Identity service principal; SAs bind via
#     Pod Identity associations (`tenant-runtime` by the operator, the app
#     SA by landing-zone)
#
# What slack-knowledge-bot's chart owns separately (NOT operator-reconciled):
#   - The chart's own ServiceAccount (`slack-knowledge-bot`) — used by both the main pod
#     and the audit-consumer Deployment. It is bound to the operator-reconciled
#     `<env>-slack-knowledge-bot-tenant` role by an EKS Pod Identity association the
#     landing-zone slack-knowledge-bot-platform component creates — no role-arn
#     annotation. App pods and AgentFleet pods (`tenant-runtime` SA) share that
#     role: one Platform, one privilege domain. Bedrock access on the role is
#     the agent-iam baseline clamped to spec.identity below; the app's
#     substrate grants arrive via spec.identity.extraPolicyArns.
#
# Tenant-shared infra (KMS, DDB, SQS, S3, Aurora pgvector, ElastiCache
# Redis, Secrets Manager seeding, the app-access managed policy) — see
# landing-zone's components/aws/slack-knowledge-bot-platform/. Once that
# component's per-env entry applies, the outputs are wired into the chart's
# per-env values (`tenantInfra.*`).

---
# The workplace team — internal employee-facing tooling: the Slack surfaces
# people ask questions through and the knowledge sources behind them (Notion,
# Confluence, Google Drive). `support` is the persona new Platforms onboarded
# here inherit, matching how the team is measured: answer quality and time to
# answer, not throughput.
apiVersion: platform.nanohype.dev/v1alpha1
kind: Tenant
metadata:
  name: workplace
  labels:
    agents.nanohype.dev/tenant: workplace
spec:
  displayName: Workplace
  primaryPersona: support
  # Soft ceiling on the sum of every owned Platform's BudgetPolicy.monthlyUsd.
  # slack-knowledge-bot is the only Platform under this Tenant today.
  aggregateMonthlyBudgetUsd: '5000'
  compliance:
    soc2: true
    hipaa: false
---
apiVersion: governance.nanohype.dev/v1alpha1
kind: BudgetPolicy
metadata:
  name: slack-knowledge-bot
  namespace: tenants-workplace
spec:
  platformRef:
    name: slack-knowledge-bot
  # Soft threshold; kill-switch fires at 120% (USD 6000) when KillSwitchEnabled
  # is true. Higher than incident-response's because slack-knowledge-bot drives both Bedrock LLM
  # calls (Claude Sonnet 4.6) and Bedrock embeddings (Titan) at every query.
  monthlyUsd: '5000'
  alertThresholdsPercent: [50, 80, 100]
  killSwitchEnabled: true
---
apiVersion: platform.nanohype.dev/v1alpha1
kind: Platform
metadata:
  name: slack-knowledge-bot
  namespace: tenants-workplace
spec:
  displayName: slack-knowledge-bot
  persona: support
  tenant: workplace
  budget:
    name: slack-knowledge-bot
  identity:
    # Bedrock model access for every pod in this Platform — app pods and
    # AgentFleet pods share the operator-reconciled `<env>-slack-knowledge-bot-tenant`
    # role. The operator clamps Bedrock invoke on that role to exactly these
    # IDs (bedrock-model-scoping inline policy over the baseline grant); the
    # entries match what the app's config invokes.
    allowedModels:
      - us.anthropic.claude-sonnet-4-6 # BEDROCK_LLM_MODEL_ID — answer generation
      - amazon.titan-embed-text-v2:0 # BEDROCK_EMBEDDING_MODEL_ID — query embeddings
    # The app's substrate grants (DDB, SQS, S3, KMS, Secrets Manager,
    # CloudWatch) — landing-zone's slack-knowledge-bot-platform component
    # emits the policy as `app_access_policy_arn`. Account-scoped, so it is
    # filled per environment at apply time (landing-zone
    # docs/first-deploy-aws.md, App platform tenants):
    #   arn:aws:iam::<account>:policy/eks-agent-platform/slack-knowledge-bot-<env>-app-access
    extraPolicyArns: []
  compliance:
    soc2: true
  isolation: namespace

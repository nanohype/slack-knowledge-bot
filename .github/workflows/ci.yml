name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + lint + typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install (app)
        # `npm ci`, not `npm install`: the install must fail on a lockfile that
        # disagrees with package.json rather than quietly resolving a new tree,
        # which is the whole point of gating on it. Both lockfiles carry the
        # platform-specific optional deps for every target (25 linux entries
        # each, all with resolved + integrity), so a glibc runner and the musl
        # image in the Dockerfile both install from the lockfile alone.
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install (slack-knowledge-bot-oauth package)
        run: npm ci --prefer-offline --no-audit --no-fund
        working-directory: packages/oauth

      - name: Lint (slack-knowledge-bot-oauth)
        run: npm run lint
        working-directory: packages/oauth

      - name: Typecheck (slack-knowledge-bot-oauth)
        run: npm run typecheck
        working-directory: packages/oauth

      - name: Test (slack-knowledge-bot-oauth)
        run: npm test
        working-directory: packages/oauth

      - name: Build slack-knowledge-bot-oauth
        run: npm run build
        working-directory: packages/oauth

      - name: Audit (production deps)
        run: npm run audit:prod

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # .editorconfig declares charset, LF endings, a final newline and no
      # trailing whitespace. Biome formats TS and JSON, so those rules hold for
      # part of the tree and are unobserved everywhere else — YAML, HCL,
      # Markdown, shell — unless something reads the whole tree against them.
      # This does, over every file `git ls-files` names.
      #
      # Indentation is delegated: Go answers to gofmt, Terraform to tofu fmt, TS
      # and JSON to biome, and Make requires tabs for recipes and spaces for the
      # continuation lines inside them. A second opinion there would either be
      # wrong or demand churn, so this takes the rules nothing else owns.
      #
      # It reads the tree and opens no socket, which is the whole reason it is an
      # action rather than a dependency: a gate on the merge path must not make
      # its verdict wait on a third party answering. `self-test` defaults on and
      # runs the gate against crafted trees first, so a gate that has quietly
      # stopped rejecting fails here rather than passing everything.
      - name: Editorconfig
        uses: nanohype/.github/actions/editorconfig-gate@b2eada74413fcc9f3042f22126ee5b350a2b846e # b2eada7

      - name: Test
        # --coverage enforces the thresholds in vitest.config.ts (75/60/75/75
        # statements/branches/functions/lines) so coverage can't silently
        # regress — same shape as the other tenant repos' CI.
        run: npm run test:coverage

      - name: SDK-mock ban invariant (ports-not-patches)
        # Ports, not SDK patches: every cross-boundary service is a
        # createXxx(deps) factory. Tests inject fakes implementing the typed
        # port — `vi.mock("<sdk-package>")` would patch the SDK module
        # itself, defeating the point. Relative-path mocks are fine (they're
        # internal modules). AWS SDK clients use aws-sdk-client-mock, which
        # attaches to the client instance, not `vi.mock`.
        run: |
          VIOLATIONS=$(grep -RnE "vi\.mock\(['\"](@aws-sdk/|@slack/bolt|@opentelemetry/|ioredis|pg|slack-knowledge-bot-oauth|node:crypto|node:http)" src --include='*.test.ts' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::SDK-mock ban: vi.mock of an SDK package is forbidden — inject a port fake instead."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "SDK-mock ban invariant holds"

      - name: Bare-fetch ban invariant
        # `fetch(` outside explicitly permitted modules: every HTTP-boundary
        # service receives `fetchImpl: typeof fetch` so tests can pass
        # `vi.fn<typeof fetch>()`. Call-sites that MUST construct fetch
        # directly (bootstrap, OAuth module bridge) are whitelisted; anything
        # else must accept fetch via deps. Opt-out on a single line with the
        # marker `// allow-fetch`.
        run: |
          VIOLATIONS=$(grep -RnE "(^|[^.A-Za-z_])fetch\(" src --include='*.ts' \
            | grep -v '\.test\.ts' \
            | grep -v 'src/index\.ts' \
            | grep -v 'src/connectors/' \
            | grep -v 'src/identity/workos-resolver\.ts' \
            | grep -v 'src/oauth/' \
            | grep -v '// allow-fetch' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Bare fetch( call outside permitted modules — inject fetchImpl instead, or add // allow-fetch."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Bare-fetch ban invariant holds"

      - name: Slack WebClient construction invariant
        # `new WebClient(` outside the Slack boundary (src/index.ts + src/slack/*)
        # leaks a hard SDK dep into a module that should be receiving a typed
        # port. Bolt wires the client itself at the app boundary; downstream
        # handlers receive it via middleware args.
        run: |
          VIOLATIONS=$(grep -RnE "new WebClient\(" src --include='*.ts' \
            | grep -v '\.test\.ts' \
            | grep -v 'src/index\.ts' \
            | grep -v 'src/slack/' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::new WebClient( outside src/index.ts / src/slack/* — inject the client via deps."
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Slack WebClient construction invariant holds"

      # The freshness report is copied verbatim into an issue body the scheduled
      # workflow re-edits weekly and a reader opens on whatever day. A commit id
      # resolved during one run and printed there is presented as the answer for
      # as long as the issue stays open, so following it re-vendors to the wrong
      # ref AND closes an issue that should stay open. This runs the report
      # against a fixture upstream repository whose history it built, and asserts
      # on the emitted bytes: exit 2, none of the commits it built appearing at
      # seven characters or more, no hex run of seven or more carrying a digit
      # whatever commit it belongs to, a remediation naming `--ref=latest` and no
      # placeholder beside it, and that command landing the pin on the fixture's
      # newest commit touching the vendored path. Both seams run it — the
      # checkout, and GitHub through a fetch stub serving the same fixture — since
      # the scheduled workflow reads only the second. It also reads the
      # scheduled workflow's own remediation block, which reaches the same reader
      # and no assertion on the script can see.
      - name: The freshness report names a command, not a commit
        run: npm run schemas:freshness:test

      # The gate's own guards, exercised rather than assumed. It removes the fix
      # every way the defect can come back — the remediation naming the resolved
      # commit, the verdict line carrying it abbreviated, the remediation back to
      # an unfollowable placeholder, `latest` rejected or resolving to the pin or
      # to the branch tip, a behind pin reporting current, and the workflow's own
      # block regressing either way — and fails unless the assertion NAMED for
      # each one is what catches it. A mutant matching its target anything other
      # than exactly once aborts the run rather than proving the gate rejects
      # something it was never shown.
      - name: The freshness gate catches what it claims to
        run: npm run schemas:freshness:selftest

      - name: platform.yaml CRD-schema gate
        # platform.yaml is applied by hand, once, and read by nothing else in
        # this repo — so a typo'd field, a missing required key, or a
        # spec.tenant naming a Tenant that was never declared would otherwise
        # travel all the way to `kubectl apply`. This validates every document
        # against the eks-agent-platform CRD schemas vendored under
        # `schemas/crd/` (a SHA-256 per file in source.json, verified before a
        # single schema is read, so a missing or hand-edited schema aborts the
        # run instead of passing vacuously), asserts cluster/namespaced scope,
        # rejects unknown fields that controller-gen schemas would otherwise
        # let through, and cross-checks the Tenant ↔ Platform ↔ BudgetPolicy ↔
        # chart-values references. The second invocation is the gate's own
        # self-test: it breaks the manifest in memory four ways, tampers with a
        # vendored schema, and fails if any of them is NOT rejected.
        run: npm run platform:validate

      # Every vendored surface (src/vendor/runtime modules, biome.base.json,
      # the tenant-chart-base chart, and the sync script itself) is a
      # byte-identical copy of its source of truth in nanohype/nanohype,
      # declared in scripts/vendored.json. A drifted copy is the defect.
      # Checked out AFTER the lint/format/test steps so the extra tree
      # never feeds biome/vitest.
      - name: Read the pinned nanohype ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository scripts/vendored.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref scripts/vendored.json)" >> "$GITHUB_OUTPUT"

      # Checked out at the pinned commit, not at main. Comparing against main
      # would make this required check a verdict about nanohype's latest merge
      # rather than about the commit under test — any library change upstream
      # would turn this repository red without a commit here. Whether the pin
      # has fallen behind is asked by the scheduled vendored-freshness
      # workflow, off the blocking path.
      - name: Checkout nanohype at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: nanohype-src

      - name: Vendored copy drift check (byte-identical copies)
        run: node scripts/sync-vendored.mjs --check
        env:
          NANOHYPE_DIR: ${{ github.workspace }}/nanohype-src

      # The gate's own guards, exercised rather than assumed. It vendors into a
      # scratch root from the same pinned checkout the step above reads, then
      # breaks the inputs every rule exists to catch — a branch name where a SHA
      # is required, a pin no checkout contains, an edited copy, an unexpected
      # or deleted file in a vendored tree, an undeclared module in an exclusive
      # directory — and fails unless each one is rejected.
      - name: Vendored copy gate self-test
        run: node scripts/sync-vendored.mjs --self-test
        env:
          NANOHYPE_DIR: ${{ github.workspace }}/nanohype-src

      - name: Build (emit dist)
        run: npm run build

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Helm lint chart
        run: helm lint chart

      - name: Helm template (staging + production)
        run: |
          mkdir -p rendered
          helm template slack-knowledge-bot chart -f chart/values-staging.yaml > rendered/staging.yaml
          helm template slack-knowledge-bot chart -f chart/values-production.yaml > rendered/production.yaml

      # The import-graph test (src/logger.import-graph.test.ts) guards the
      # mechanism that broke this binary once: a transitive import of the app
      # config, which exits 1 at module scope on values this Deployment does not
      # supply. It cannot catch a different mechanism producing the same
      # outcome — a chart env var dropped, a new module-scope side effect, a
      # changed entrypoint. So this runs the binary under the env the rendered
      # chart actually gives it and asserts it reaches ready.
      #
      # Hermetic by construction: no AWS credentials are passed. The consumer
      # fails its first SQS receive with CredentialsProviderError and backs off,
      # which is correct off-cluster, while still serving /health. The assertion
      # stops at ready, before any of that.
      - name: audit-consumer boots under its chart env
        run: node scripts/smoke-audit-consumer.mjs rendered/staging.yaml

      # Source files are gated elsewhere; this asserts the RENDERED chart too —
      # a zero account id, placeholder token, or account-less ARN that only
      # appears after templating.
      - name: DNS egress is scoped to kube-dns, not to all of kube-system
        run: |
          # A NetworkPolicy `to:` list is a list of PEERS, and peers are OR'd.
          # namespaceSelector and podSelector AND each other only inside ONE peer;
          # as two sibling list items they mean "every pod in kube-system" OR
          # "every same-namespace pod labelled k8s-app=kube-dns". Both forms render,
          # both are valid, both lint clean, and only one of them is DNS-only —
          # which is how the OR shipped here and in three sibling charts.
          python3 - <<'EOF'
          import glob, sys, yaml
          checked = 0
          for path in sorted(glob.glob("rendered/*.yaml")):
              for doc in yaml.safe_load_all(open(path)):
                  if not doc or doc.get("kind") != "NetworkPolicy":
                      continue
                  for rule in (doc["spec"].get("egress") or []):
                      ports = [str(p.get("port")) for p in (rule.get("ports") or [])]
                      if "53" not in ports:
                          continue
                      checked += 1
                      for peer in (rule.get("to") or []):
                          if "namespaceSelector" in peer and "podSelector" not in peer:
                              sys.exit(
                                  f"{path}: the DNS egress rule has a namespaceSelector "
                                  f"peer with no podSelector, so it allows egress to EVERY "
                                  f"pod in that namespace. Put both selectors in one peer."
                              )
          if not checked:
              sys.exit("no DNS egress rule found in rendered/ — this check verified nothing")
          print(f"ok  {checked} DNS egress rule(s) scope to kube-dns, not to a whole namespace")
          EOF
      - name: Assert no unfilled sentinels in rendered output
        uses: nanohype/nanohype/.github/actions/render-assert@main
        with:
          manifests: rendered

  docs:
    name: docs
    runs-on: ubuntu-latest
    # Its own job because FOUR_PHASE_CONTRACT wants build, lint, test and docs
    # as four separately-failing phases. It was previously satisfied by an
    # `echo`, which exits 0 and regenerates nothing — a phase that cannot fail
    # is not a phase, and nothing here invoked it anyway.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # `npm ci`, matching the verify job.
      - run: npm ci --prefer-offline --no-audit --no-fund

      # slack-knowledge-bot-oauth is a `file:` dependency on packages/oauth, so
      # it resolves to types only once that package has been built. typedoc
      # type-checks the whole program, so without this it fails on every import
      # of the module rather than on anything it was asked to document.
      - name: Install and build slack-knowledge-bot-oauth
        run: |
          npm ci --prefer-offline --no-audit --no-fund
          npm run build
        working-directory: packages/oauth

      - name: Generate the API reference
        run: npm run docs

  crd-schema-drift:
    name: CRD schema drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The digests in schemas/crd/source.json prove the vendored copies were
      # not edited in place. They cannot prove the pin still describes them: a
      # ref bumped without re-vendoring, or a re-vendor without moving the ref,
      # leaves the digests internally consistent and upstream-wrong. This job is
      # that half. Checking the pinned SHA out — rather than a branch — is what
      # keeps it deterministic: the schema CI compares against cannot change
      # without a commit here that moves the pin.
      - name: Read the pinned operator ref
        id: pin
        run: |
          echo "repo=$(jq -r .upstream.repository schemas/crd/source.json)" >> "$GITHUB_OUTPUT"
          echo "ref=$(jq -r .upstream.ref schemas/crd/source.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout eks-agent-platform at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.ref }}
          path: .eks-agent-platform

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Verifies both halves against that checkout: every vendored file matches
      # its recorded digest, and every vendored file is byte-identical to
      # upstream at the pinned commit. An unreachable checkout, a HEAD that is
      # not the pinned SHA, or a file that is not a CRD all fail the job —
      # nothing here degrades into a skip.
      #
      # Whether that pin has fallen behind upstream is a different question, and
      # not one a required check may answer — its verdict would change when
      # someone pushes to another repository. The scheduled crd-schema-freshness
      # workflow asks it instead.
      - name: Vendored CRD schemas match the pinned upstream commit
        run: npm run schemas:check
        env:
          EKS_AGENT_PLATFORM_DIR: .eks-agent-platform

  live-redis:
    name: rate limiter against a real Redis
    runs-on: ubuntu-latest
    # The limiter decides and spends in one Lua script, and a fake `eval` is a
    # transcription of that script rather than the script: it cannot fail on Lua
    # that does not parse, on a `redis.call` with the wrong arity, on an argument
    # Redis hands over as a string, or on a reply shape the client cannot read.
    # A server is what produces those, so one runs here.
    #
    # On every pull request, unlike the model tier in `evals`. That tier is
    # dispatch-only because it spends money per run; a Redis container costs a
    # few seconds, so "needs a live Redis to verify" is a service block rather
    # than a budget.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Without this the job can reach the step before the server accepts
        # connections, and a suite that cannot connect has verified nothing.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci --prefer-offline --no-audit --no-fund

      - name: The limiter's script, executed by Redis
        run: npm run test:redis
        env:
          REDIS_URL: redis://127.0.0.1:6379

  docker:
    name: docker build (no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slack-knowledge-bot:ci .

  merge-gate:
    name: merge gate
    runs-on: ubuntu-latest
    needs:
      [
        verify,
        docs,
        crd-schema-drift,
        live-redis,
        docker,
      ]
    # always() is load-bearing: without it a failed dependency SKIPS this job,
    # and GitHub counts a skipped check as passing for branch protection, so the
    # gate would report green exactly when something broke.
    #
    # Restricted to pull_request because the gate treats a skipped dependency as
    # a failure, and a job carrying `if: github.event_name == 'pull_request'` is
    # legitimately skipped on a push to main. The gate exists to gate merges, and
    # merges come from pull requests; on push it is skipped and gates nothing.
    if: always() && github.event_name == 'pull_request'
    steps:
      - uses: nanohype/.github/actions/merge-gate@6ec6c5b3e6c4a8b15e12da4afd7ac4870a630092 # main
        with:
          needs: ${{ toJSON(needs) }}
          gate-job-id: merge-gate
